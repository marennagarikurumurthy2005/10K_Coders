<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pomodoro Timer</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
        }

        .progress{
    stroke:#38bdf8;
    stroke-dasharray:754;
    stroke-dashoffset:0;
    transition:stroke-dashoffset 1s linear;
    filter:drop-shadow(0 0 8px #38bdf8);

    animation: glow 2s infinite alternate;
}

@keyframes glow{
    from{
        filter:drop-shadow(0 0 5px #38bdf8);
    }
    to{
        filter:drop-shadow(0 0 20px #38bdf8);
    }
}

        .mainwrapper{
            width:350px;
            padding:40px 30px;
            border-radius:25px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
            text-align:center;
        }

        .progress-container{
            position:relative;
            width:250px;
            height:250px;
            margin:auto;
        }

        svg{
            width:250px;
            height:250px;
            transform:rotate(-90deg);
        }

        circle{
            fill:none;
            stroke-width:10;
            stroke-linecap:round;
        }

        .bg{
            stroke:#334155;
        }

        .progress{
            stroke:#38bdf8;
            stroke-dasharray:754;
            stroke-dashoffset:0;
            transition:stroke-dashoffset 1s linear;
            filter:drop-shadow(0 0 10px #38bdf8);
        }

        .display{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
        }

        .display-text{
            color:white;
            font-size:3.5rem;
            font-weight:bold;
            letter-spacing:3px;
            animation:pulse 1.5s infinite;
        }

        @keyframes pulse{
            0%{
                transform:scale(1);
            }
            50%{
                transform:scale(1.05);
            }
            100%{
                transform:scale(1);
            }
        }

        .button-holders{
            margin-top:35px;
            display:flex;
            justify-content:center;
            gap:15px;
        }

        button{
            padding:12px 22px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-size:1rem;
            font-weight:bold;
            transition:0.3s;
            color:white;
        }

        #start{
            background:#22c55e;
        }

        #pause{
            background:#f59e0b;
        }

        #reset{
            background:#ef4444;
        }

        button:hover{
            transform:translateY(-3px) scale(1.05);
            box-shadow:0 5px 15px rgba(255,255,255,0.2);
        }

        button:active{
            transform:scale(0.95);
        }

    </style>

</head>

<body>

    <div class="mainwrapper">

        <div class="progress-container">

            <svg>
                <circle class="bg" cx="125" cy="125" r="120"></circle>

                <circle 
                    class="progress"
                    id="progress-circle"
                    cx="125"
                    cy="125"
                    r="120">
                </circle>
            </svg>

            <div class="display">
                <h1 class="display-text" id="display-text">25:00</h1>
            </div>

        </div>

        <div class="button-holders">
            <button type="button" id="start">Start</button>
            <button type="button" id="pause">Pause</button>
            <button type="reset" id="reset">Reset</button>
        </div>

    </div>

</body>

<script src="./scripts.js"></script>

</html>
