<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | MK Store</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#f5f7fa,#dfe9f3);
        }

        .success-card{
            background:white;
            padding:50px 40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            max-width:500px;
            width:90%;
        }

        .success-icon{
            width:100px;
            height:100px;
            border-radius:50%;
            background:#2ecc71;
            color:white;
            font-size:50px;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 25px;
        }

        h2{
            color:#2c3e50;
            margin-bottom:15px;
        }

        p{
            color:#7f8c8d;
            line-height:1.6;
            margin-bottom:30px;
        }

        .order-info{
            background:#f8f9fa;
            padding:15px;
            border-radius:12px;
            margin-bottom:30px;
        }

        .btn-container{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:14px 25px;
            border-radius:10px;
            color:white;
            transition:0.3s;
            font-weight:bold;
        }

        .shop-btn{
            background:#3498db;
        }

        .shop-btn:hover{
            background:#2980b9;
        }

        .home-btn{
            background:#2ecc71;
        }

        .home-btn:hover{
            background:#27ae60;
        }

    </style>
</head>
<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h2>Purchase Successful!</h2>

        <p>
            Thank you for shopping with MK Store.
            Your order has been placed successfully.
        </p>

        <div class="order-info">
            <strong>Order Status:</strong> Confirmed<br>
            <strong>Payment Status:</strong> Successful
        </div>

        <div class="btn-container">

            <a href="{% url 'product_list' %}" class="btn shop-btn">
                Continue Shopping
            </a>

            <a href="{% url 'view_cart' %}" class="btn home-btn">
                View Cart
            </a>

        </div>

    </div>

</body>
</html>
