<!DOCTYPE html>
<html>
<head>

<title>History</title>

<style>

body{
    background:#f4f6f9;
    font-family:Segoe UI;
    padding:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#673AB7;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

a{
    text-decoration:none;
    color:white;
    padding:8px 12px;
    border-radius:5px;
}

.restore{
    background:#4CAF50;
}

.permanent{
    background:#f44336;
}

.top{
    margin-bottom:20px;
}

.top a{
    background:#2196F3;
    padding:10px 15px;
}

</style>

</head>
<body>

<div class="top">
    <a href="{% url 'create' %}">
        Home
    </a>
</div>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Description</th>
    <th>Priority</th>
    <th>Status</th>
    <th>Actions</th>
</tr>

{% for i in data %}

<tr>

<td>{{i.id}}</td>
<td>{{i.name}}</td>
<td>{{i.description}}</td>
<td>{{i.priority}}</td>
<td>{{i.status}}</td>

<td>

<a class="restore"
href="{% url 'retrive' i.id %}">
Restore
</a>

<a class="permanent"
href="{% url 'pd' i.id %}">
Delete Permanently
</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
