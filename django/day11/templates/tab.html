<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        table{
            width:500px;
            background:white;
            border-collapse:collapse;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        tr:first-child{
            background:#667eea;
            color:white;
            font-weight:bold;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #eee;
        }

        tr:not(:first-child):hover{
            background:#f5f7ff;
            transition:0.3s;
        }

        td a{
            text-decoration:none;
            color:#667eea;
            font-weight:600;
        }

        td a:hover{
            color:#764ba2;
        }

        .back-btn{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#2ecc71;
            cursor:pointer;
            transition:0.3s;
        }

        .back-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
        }

        .back-btn a{
            text-decoration:none;
            color:white;
            font-weight:600;
            font-size:16px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>ID</td>
            <td>NAME</td>
        </tr>

        {% for i in emp %}
        <tr>
            <td>
                <a href="{% url 'single' i.id %}">
                    {{ i.id }}
                </a>
            </td>
            <td>{{ i.name }}</td>
        </tr>
        {% endfor %}

    </table>

    <button class="back-btn">
        <a href="{% url 'home' %}">BACK</a>
    </button>

</body>
</html>
