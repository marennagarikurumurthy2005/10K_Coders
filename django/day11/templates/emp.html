<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        form{
            background:#fff;
            width:100%;
            max-width:450px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        form::before{
            content:"Employee Registration";
            text-align:center;
            font-size:28px;
            font-weight:700;
            color:#333;
            margin-bottom:10px;
        }

        input{
            padding:14px 16px;
            border:2px solid #e0e0e0;
            border-radius:10px;
            font-size:16px;
            transition:0.3s ease;
            outline:none;
        }

        input:focus{
            border-color:#667eea;
            box-shadow:0 0 10px rgba(102,126,234,0.3);
        }

        input::placeholder{
            color:#999;
        }

        button{
            padding:14px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(102,126,234,0.4);
        }

        .details-btn{
            margin-top:20px;
            background:white;
            padding:12px 25px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }

        .details-btn a{
            text-decoration:none;
            color:#667eea;
            font-weight:600;
            font-size:16px;
        }

        .details-btn:hover{
            transform:translateY(-2px);
        }
    </style>
</head>
<body>
    
    <form action="" method="post">
{% csrf_token %}

        <input type="text" name="name" id="" placeholder="enter name">
        <input type="text" placeholder="enter dept" name="dept" id="">
        <input type="number" placeholder="enter age " name="age" id="">
        <input type="number" name="salary" placeholder="salary" id="">
        <button type="submit">SUBMIT</button>

    </form>
    <button class="details-btn">
    <a href="{% url 'details' %}">VIEW DETAILS</a>
</button>

</body>
</html>
