<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.singlewrapper{
    width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.singlewrapper h1{
    text-align:center;
    margin-bottom:25px;
    color:#333;
    border-bottom:2px solid #667eea;
    padding-bottom:10px;
}

.singlewrapper h2{
    margin:15px 0;
    padding:12px 15px;
    background:#f5f7ff;
    border-left:5px solid #667eea;
    border-radius:8px;
    color:#444;
    font-size:18px;
    transition:.3s;
}

.singlewrapper h2:hover{
    transform:translateX(5px);
    background:#eef1ff;
}

.btn-group{
    margin-top:25px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    text-decoration:none;
    padding:12px 25px;
    border-radius:10px;
    color:white;
    font-weight:600;
    transition:.3s;
}

.home{
    background:#3498db;
}

.details{
    background:#9b59b6;
}

.update{
    background:#2ecc71;
}

.delete{
    background:#e74c3c;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}
</style>
<body>
    <div class="singlewrapper">

    <h1>Employee Details</h1>

    <h2>ID : {{emp.id}}</h2>
    <h2>Name : {{emp.name}}</h2>
    <h2>Salary : ₹{{emp.salary}}</h2>
    <h2>Department : {{emp.dept}}</h2>
    <h2>Age : {{emp.age}}</h2>

</div>

<div class="btn-group">
    <a href="{% url 'home' %}" class="btn home">HOME</a>

    <a href="{% url 'details' %}" class="btn details">
        DETAILS
    </a>

    <a href="{% url 'update' emp.id %}" class="btn update">
        UPDATE
    </a>

    <a href="{% url 'delete' emp.id %}" class="btn delete">
        DELETE
    </a>
</div>
</body>
</html>
