<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        .form-container{
            width:100%;
            max-width:450px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        .form-container h1{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        input{
            padding:14px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#667eea;
            box-shadow:0 0 10px rgba(102,126,234,0.3);
        }

        button{
            padding:14px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
            transition:0.3s;
        }

        .update-btn{
            background:#2ecc71;
            color:white;
        }

        .update-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(46,204,113,0.3);
        }

        .details-btn{
            margin-top:20px;
            background:#3498db;
            padding:12px 25px;
            border-radius:10px;
            text-decoration:none;
            color:white;
            font-weight:600;
            display:inline-block;
            transition:0.3s;
        }

        .details-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(52,152,219,0.3);
        }
    </style>
</head>
<body>

    <div class="form-container">

        <h1>✏️ Update Employee</h1>

        <form action="" method="post">
            {% csrf_token %}

            <input
                type="text"
                name="name"
                value="{{ emp.name }}"
                placeholder="Enter Name"
            >

            <input
                type="text"
                name="dept"
                value="{{ emp.dept }}"
                placeholder="Enter Department"
            >

            <input
                type="number"
                name="age"
                value="{{ emp.age }}"
                placeholder="Enter Age"
            >

            <input
                type="number"
                name="salary"
                value="{{ emp.salary }}"
                placeholder="Enter Salary"
            >

            <button type="submit" class="update-btn">
                UPDATE EMPLOYEE
            </button>

        </form>

    </div>

    <a href="{% url 'details' %}" class="details-btn">
        📋 VIEW DETAILS
    </a>

</body>
</html>
